# Cloudflare Workers 部署配置
# 前置：bun run build（生成 dist/）后执行 wrangler deploy
name = "llm-usage-monitor"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# 前端静态资源（dist/ 由 vp build 生成，SPA 模式回退到 index.html）
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# 多账号密钥请用 secret 配置（wrangler secret put DEEPSEEK_API_KEY 等），
# 不要写入本文件。本地调试用 .dev.vars（参考 .dev.vars.example）。
