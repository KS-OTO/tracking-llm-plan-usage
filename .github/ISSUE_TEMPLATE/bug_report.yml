name: 🐛 Bug 报告
description: 数据不对、页面异常、构建/测试失败
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **不要粘贴真实凭据。** API Key / Cookie / Token 一律写成 `sk-xxxx`、`AKLTxxxx` 这类占位值；
        > 站点地址请写 `https://your-domain.example`。
        > 安全漏洞请走 [SECURITY.md](https://github.com/KS-OTO/tracking-llm-plan-usage/blob/main/SECURITY.md) 的私密渠道，**不要**开在这里。

  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 数据错误（余额 / 用量 / 进度与实际不符）
        - 页面渲染 / 布局 / 主题
        - 构建或类型检查失败
        - 测试失败
        - 部署（Workers / EdgeOne / Vercel / 自托管）
        - 其他
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: 涉及的平台
      description: 如果是数据问题，填出现问题的平台（如 智谱 GLM / 火山方舟 / 模力方舟 / New API / 未涉及）
      placeholder: 智谱 GLM
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你看到什么、期望看到什么。有截图最好。
      placeholder: |
        卡片上显示「已用 ¥0.00 / ¥100.00」，但智谱控制台显示本月已用 ¥12.34。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好。若是配置相关，请给出**脱敏后**的相关环境变量名（不用给值）。
      placeholder: |
        1. 在 .env 里配置 ZHIPU_API_KEY
        2. bun run dev:all
        3. 切到「套餐订阅」Tab
    validations:
      required: true

  - type: textarea
    id: expected-shape
    attributes:
      label: 上游原始响应（可选但很有用）
      description: 如果这是数据解析问题，贴一段 `curl` 到的原始 JSON（**删掉 token 与账号 id**）。
      render: json
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 提交版本
      description: 输出 `git rev-parse --short HEAD` 的结果
      placeholder: 5de7cdf
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 本地开发（bun run dev / dev:all）
        - Cloudflare Workers
        - 腾讯云 EdgeOne Makers
        - Vercel
        - 自托管（Bun / Node 直接跑 server）
        - 其他
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、Bun 版本、浏览器与版本
      placeholder: |
        Windows 11 / Bun 1.2.5 / Edge 151
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认正文里没有任何真实凭据、Cookie 或个人站点域名
          required: true
        - label: 我已搜索过现有 issue，没有重复
          required: true
