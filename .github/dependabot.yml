version: 2
updates:
  # 前端与工具链依赖。
  #
  # 生态必须是 `bun` 而不是 `npm`：本项目用 Bun 装包，锁文件是文本格式的 `bun.lock`。
  # 用 `npm` 时 Dependabot 只改 `package.json`、**不碰 `bun.lock`**，
  # 于是 CI 里的 `bun install --frozen-lockfile` 立刻报
  # 「lockfile had changes, but lockfile is frozen」—— 每个依赖 PR 都必然失败。
  # 换成 `bun` 后它才会连锁文件一起更新（要求 Bun >= 1.1.39 且用文本锁文件）。
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 一起升级、一起跑门禁，避免十几个 PR 互相踩。
      #
      # 但**只组 minor + patch**：把 major 也塞进来会得到一个没法审的巨型 PR。
      # 实测过一次：dev-dependencies 组一口气带了 typescript 6→7、@types/node 24→26、
      # jsdom 29→30、vite-plus 0.2.7→0.3.2 共 12 项，CI 直接报
      # 「Cannot find native binding」（vite-plus 的原生绑定没解析上）。
      # major 走单独 PR，才能一个一个看、一个一个升。
      minor-and-patch:
        # 不分 dependency-type：生产依赖的补丁升级同样值得合进来
        update-types:
          - minor
          - patch
      tdesign:
        patterns:
          - 'tdesign-*'
        update-types:
          - minor
          - patch
      vue:
        patterns:
          - 'vue'
          - 'vue-router'
          - 'pinia'
          - '@vue/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
